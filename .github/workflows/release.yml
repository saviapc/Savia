# Compila Savia.exe desde el código público, lo firma con SignPath (cuando está configurado)
# y lo publica con su SHA-256 y una atestación de procedencia.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la etiqueta coincide con VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("${{ github.ref_name }}" -ne "v$v") { throw "La etiqueta ${{ github.ref_name }} no coincide con VERSION ($v)" }

      - name: Compilar
        shell: cmd
        run: build.cmd

      - name: Subir el .exe sin firmar
        id: sin-firmar
        uses: actions/upload-artifact@v4
        with:
          name: Savia-sin-firmar
          path: dist/Savia.exe

      # Firma con el certificado de SignPath Foundation. Cada versión se aprueba a mano en SignPath.
      # Si los secretos aún no están configurados, este paso se omite y se publica sin firma.
      - name: Firmar con SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: savia
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/firmado

      - name: Usar el .exe firmado
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item dist/firmado/Savia.exe dist/Savia.exe -Force

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/Savia.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Savia.exe" | Set-Content dist/Savia.exe.sha256 -Encoding ascii
          "SHA-256: $h" >> $env:GITHUB_STEP_SUMMARY

      - name: Atestación de procedencia
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Savia.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Savia
          path: |
            dist/Savia.exe
            dist/Savia.exe.sha256

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = (Get-Content dist/Savia.exe.sha256).Split(' ')[0]
          $firma = if ($env:SIGNPATH_API_TOKEN) { "Firmado con el certificado de SignPath Foundation." } else { "Sin firma digital todavía." }
          gh release create "${{ github.ref_name }}" dist/Savia.exe dist/Savia.exe.sha256 `
            --title "Savia ${{ github.ref_name }}" `
            --notes "Descarga **Savia.exe**. $firma`n`nSHA-256: ``$h``"
